# @package _global_

defaults:
  - train
  - override /task: libero_uncond_2cam224_1e-4
  - _self_

ckpt: null
gpu_id: 0

model:
  load_text_encoder: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

EVALUATION:
  task_suite_name: libero_spatial
  task_id: 0
  num_trials: 50
  trial_indices: null
  output_dir: ./evaluate_results/libero/${hydra:runtime.choices.task}/${now:%Y%m%d_%H%M%S}

  # Runtime behavior
  env_num: 1
  num_steps_wait: 30
  replan_steps: 10
  binarize_gripper: true
  use_action_ensembler: false
  # Pixel WAM evaluates the full eight-frame prediction at every closed-loop
  # replan by default. This is independent from video encoding below.
  compute_video_metrics: true
  # Deprecated compatibility flag for older launch commands. New code should
  # use compute_video_metrics and save_prediction_videos explicitly.
  visualize_future_video: false
  # Keep historical rollout-video saving by default. Large success-only
  # evaluations can disable it explicitly and use a separate fixed video set.
  save_rollout_videos: true
  save_prediction_videos: true
  save_prediction_clip_videos: true

  # Action inference
  action_horizon: null
  num_inference_steps: ${eval_num_inference_steps}
  sigma_shift: null
  # Pixel-model video metrics consistently favored logit-normal nodes over
  # uniform nodes with Euler; shift 17 matches the training-time sampler.
  inference_schedule: logit_normal
  inference_schedule_shift: 17.0
  text_cfg_scale: 1.0
  negative_prompt: ""
  rand_device: cpu
  tiled: false

  # Future-video metrics. They are evaluated at every closed-loop replan on
  # generated frames only; the conditioning frame is saved for visualization
  # but excluded from scores. At each replan the evaluator saves the simulator
  # and controller state, executes the metric horizon to collect GT frames,
  # restores that state, then executes `replan_steps` actions for success rate.
  video_metric_horizon_steps: 32
  video_metric_replan_indices: null
  compute_lpips: true
  lpips_net: vgg
  metrics_exclude_conditioning_frame: true
  compute_gfvd: true
  fvd_detector_path: auxiliary_weights/metrics/i3d_torchscript.pt
  gfvd_num_frames: 16

  # Optional external inputs
  dataset_stats_path: null
  device: cuda

MULTIRUN:
  create_only: false
  task_file: null
  task_suite_names:
    - libero_10
    - libero_goal
    - libero_spatial
    - libero_object
  num_gpus: 8
  max_tasks_per_gpu: 2

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
